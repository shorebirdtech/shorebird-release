name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  parse-args:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🧪 Test parse_args
        shell: bash
        run: bash test/parse_args_test.sh

  args:
    # Pins how `args` is split into arguments end to end, using a stub
    # `shorebird` that records its argv. Parser edge cases live in
    # test/parse_args_test.sh.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        case:
          - name: plain
            args: --verbose -- --dart-define=A=b
            expected: "[release][android][--flutter-version][latest][--verbose][--][--dart-define=A=b]"
          - name: double-quoted
            args: -- --dart-define="A=b"
            expected: "[release][android][--flutter-version][latest][--][--dart-define=A=b]"
          - name: double-quoted-space
            args: -- --dart-define="A=b c"
            expected: "[release][android][--flutter-version][latest][--][--dart-define=A=b c]"
          - name: single-quoted-space
            args: -- --dart-define=MSG='hi there'
            expected: "[release][android][--flutter-version][latest][--][--dart-define=MSG=hi there]"
          - name: literal-block
            args: |
              --verbose
              --flavor=prod
            expected: "[release][android][--flutter-version][latest][--verbose][--flavor=prod]"
          - name: line-continuation
            args: |
              --verbose \
                --flavor=prod
            expected: "[release][android][--flutter-version][latest][--verbose][--flavor=prod]"
          - name: empty
            args: ""
            expected: "[release][android][--flutter-version][latest]"
          - name: rejects-expansion
            args: -- --dart-define=SHA=$GITHUB_SHA
            should-fail: true

    name: args (${{ matrix.case.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🪶 Stub Shorebird
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/stub"
          cat > "$RUNNER_TEMP/stub/shorebird" <<'STUB'
          #!/usr/bin/env bash
          printf '[%s]' "$@" > "$RUNNER_TEMP/argv.txt"
          echo "✅ Published Release 0.1.0+1!"
          STUB
          chmod +x "$RUNNER_TEMP/stub/shorebird"
          echo "$RUNNER_TEMP/stub" >> "$GITHUB_PATH"

      - name: 🐦 Shorebird Release
        uses: ./
        id: shorebird-release
        continue-on-error: ${{ matrix.case.should-fail == true }}
        with:
          args: ${{ matrix.case.args }}
          flutter-version: latest
          platform: android

      - name: 🚦 Assert Rejected
        if: matrix.case.should-fail
        shell: bash
        run: |
          [[ "${{ steps.shorebird-release.outcome }}" == "failure" ]]
          [[ ! -e "$RUNNER_TEMP/argv.txt" ]]

      - name: 🚦 Assert Arguments
        if: ${{ !matrix.case.should-fail }}
        shell: bash
        env:
          EXPECTED: ${{ matrix.case.expected }}
          RELEASE_VERSION: ${{ steps.shorebird-release.outputs.release-version }}
        run: |
          actual="$(cat "$RUNNER_TEMP/argv.txt")"
          echo "expected: $EXPECTED"
          echo "actual:   $actual"
          [[ "$actual" == "$EXPECTED" ]]
          [[ "$RELEASE_VERSION" == "0.1.0+1" ]]

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: ☕ Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: ✨ Create New Flutter Project
        run: flutter create e2e_test --empty

      - name: 🐦 Shorebird Init
        # Org id is tied to the shorebirdtest@gmail.com account that backs
        # SHOREBIRD_TOKEN. If this id rotates (e.g. the account is recreated),
        # `shorebird init` will fail with "Organization with ID '...' not
        # found" and list the new id under "Available organizations" — copy
        # that id here.
        run: shorebird init --force --organization-id=46686
        working-directory: e2e_test

      - name: 🐦 Shorebird Release
        uses: ./
        id: shorebird-release
        with:
          args: --verbose
          flutter-version: latest
          platform: android
          working-directory: e2e_test

      - name: 🚦 Assert Release Version (MacOS/Linux)
        if: runner.os != 'Windows'
        run: |
          if [[ ${{ steps.shorebird-release.outputs.release-version }} =~ "0.1.0+1" ]]; then
            echo '✅ Shorebird Release Succeeded!'
          else
            echo '❌ Shorebird Release Failed.'
            exit 1
          fi

      - name: 🚦 Assert Release Version (Windows)
        if: runner.os == 'Windows'
        run: |
          if ("${{ steps.shorebird-release.outputs.release-version }}" -match "0.1.0\+1") {
            Write-Output "✅ Shorebird Release Succeeded!"
          } else {
            Write-Output "❌ Shorebird Release Failed."
            exit 1
          }
