name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v6

      - name: 🎯 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: ☕ Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: ✨ Create New Flutter Project
        run: flutter create e2e_test --empty

      - name: 🐦 Shorebird Init
        run: shorebird init --force --organization-id=14235
        working-directory: e2e_test

      - name: 🐦 Shorebird Release
        uses: ./
        id: shorebird-release
        with:
          args: --verbose
          flutter-version: latest
          platform: android
          working-directory: e2e_test

      - name: 🚦 Assert Release Version (MacOS/Linux)
        if: runner.os != 'Windows'
        run: |
          if [[ ${{ steps.shorebird-release.outputs.release-version }} =~ "0.1.0+1" ]]; then
            echo '✅ Shorebird Release Succeeded!'
          else
            echo '❌ Shorebird Release Failed.'
            exit 1
          fi

      - name: 🚦 Assert Release Version (Windows)
        if: runner.os == 'Windows'
        run: |
          if ("${{ steps.shorebird-release.outputs.release-version }}" -match "0.1.0\+1") {
            Write-Output "✅ Shorebird Release Succeeded!"
          } else {
            Write-Output "❌ Shorebird Release Failed."
            exit 1
          }

  e2e-dry-run:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        dry-run-flag: ["--dry-run", "-n"]

    runs-on: ${{ matrix.os }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🎯 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: ✨ Create New Flutter Project
        run: flutter create e2e_test_dry_run --empty

      - name: 🐦 Shorebird Init
        run: shorebird init --force
        working-directory: e2e_test_dry_run

      - name: 🐦 Shorebird Release (Dry Run)
        uses: ./
        id: shorebird-release-dry-run
        with:
          args: ${{ matrix.dry-run-flag }} --verbose
          flutter-version: latest
          platform: android
          working-directory: e2e_test_dry_run

      - name: 🚦 Assert Dry Run Succeeded (MacOS/Linux)
        if: runner.os != 'Windows'
        run: |
          if [[ -z "${{ steps.shorebird-release-dry-run.outputs.release-version }}" ]]; then
            echo '✅ Shorebird Release Dry Run Succeeded!'
          else
            echo '❌ Shorebird Release Dry Run Failed - release-version should be empty.'
            exit 1
          fi

      - name: 🚦 Assert Dry Run Succeeded (Windows)
        if: runner.os == 'Windows'
        run: |
          if ([string]::IsNullOrEmpty("${{ steps.shorebird-release-dry-run.outputs.release-version }}")) {
            Write-Output "✅ Shorebird Release Dry Run Succeeded!"
          } else {
            Write-Output "❌ Shorebird Release Dry Run Failed - release-version should be empty."
            exit 1
          fi
