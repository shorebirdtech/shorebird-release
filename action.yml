name: Shorebird Release
description: Create a new release using the Shorebird CLI

branding:
  icon: package
  color: green

inputs:
  args:
    description: The arguments to pass to the Shorebird release command
    required: false
    default: ""
  flutter-version:
    description: The version of Flutter to use for the release. Use "latest" to always target the latest stable version.
    required: true
  platform:
    description: The platform for which to create a release (e.g. android, ios)
    required: true
  working-directory:
    description: The working directory in which to run Shorebird
    required: false
    default: .

outputs:
  release-version:
    description: The version of the release that was created. Empty for --dry-run.
    value: ${{ steps.shorebird-release.outputs.release-version }}

runs:
  using: composite
  steps:
    - name: 🐦 Shorebird Release
      shell: bash
      id: shorebird-release
      working-directory: ${{ inputs.working-directory }}
      env:
        ARGS: ${{ inputs.args }}
        FLUTTER_VERSION: ${{ inputs.flutter-version }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail

        # Parse args with shell quoting rules, matching v1.0.0 where args were
        # interpolated directly into the command line. Line continuations and
        # newlines (from YAML `|` blocks) are folded into spaces first so a
        # multi-line value stays one command.
        if [[ "$ARGS" == *$'\n'* ]]; then
          echo "::warning::inputs.args contains newlines; converting them to spaces. Consider using YAML '>-'."
        fi
        CONTINUATION=$'\\\n'
        ARGS="${ARGS//"$CONTINUATION"/ }"
        ARGS="${ARGS//$'\n'/ }"
        eval "set -- $ARGS"

        # --dry-run validates without publishing, so there's no release
        # version to report. Flags after `--` go to Flutter, not shorebird.
        DRY_RUN=false
        for arg in "$@"; do
          [[ "$arg" == "--" ]] && break
          [[ "$arg" == "--dry-run" || "$arg" == "-n" ]] && DRY_RUN=true
        done

        LOG="$RUNNER_TEMP/shorebird-release.log"
        shorebird release "$PLATFORM" \
          --flutter-version "$FLUTTER_VERSION" \
          "$@" \
          | tee "$LOG"

        if [[ "$DRY_RUN" == true ]]; then
          echo "Dry run succeeded; no release was published."
          exit 0
        fi

        GREP_MATCH="$(grep -Ei "Published Release (.*)" "$LOG" || true)"
        if [[ -n "$GREP_MATCH" ]]; then
          # Strip the non-version-number characters from the line
          RELEASE_VERSION="$(echo "$GREP_MATCH" | sed -E 's/^.+ Published Release (.*)\!$/\1/')"
          echo "release-version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
        else
          echo "Failed to create release"
          exit 1
        fi
